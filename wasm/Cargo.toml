[package]
name = "musicbox-wasm"
version = "0.1.0"
edition = "2024"
license = "CC-BY-SA-4.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Ben Askins' musicbox-core, vendored from 8aa47f2 and modified (tuning); see engine/
musicbox-core = { path = "../engine" }
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
